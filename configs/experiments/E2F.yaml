# E2F: site-fidelity replication of E2 (week-7 spec section 3). H3F uses cell 3.
# Cells are paired (every cell uses cell 0's random streams; week-7 addendum section 3).
name: E2F
base: configs/baseline.yaml
controllers: [C0, C1, C2, C3, C4]
seeds: 100
overrides_file: configs/tuned_params_fidelity.yaml
paired_cells: true
cells:
  - {}                                          # 0: next to a patch (baseline)
  - {hazards: [[6.25, 6.25, 1.0]]}               # 1: between patch and nest
  - {hazards: [[5.0, 9.0, 1.0]]}                 # 2: far from everything
  - {hazards: [], random_fail_rate: 0.0000266}   # 3: no hazard, random failures
